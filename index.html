    <style>
        /* Estilos Globais e Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #020205; /* Fundo preto profundo idêntico à imagem */
            color: #ffffff;
            font-family: 'Plus Jakarta Sans', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 16px;
            overflow-x: hidden;
        }

        .container {
            max-width: 650px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 1. Carrossel de Filmes (Topo) */
        .featured-title {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #4b5563;
            margin-bottom: 20px;
            font-weight: 700;
        }

        .movie-carousel {
            display: flex;
            gap: 12px;
            width: 100vw;
            max-width: 650px;
            overflow-x: auto;
            padding: 0 10px 20px 10px;
            scrollbar-width: none; /* Oculta scroll no Firefox */
        }

        .movie-carousel::-webkit-scrollbar {
            display: none; /* Oculta scroll no Chrome/Safari */
        }

        .movie-card {
            min-width: 115px;
            max-width: 115px;
            text-align: left;
        }

        .image-container {
            position: relative;
            width: 100%;
            aspect-ratio: 2 / 3;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 8px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
        }

        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .rating-badge {
            position: absolute;
            top: 6px;
            right: 6px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 9px;
            font-weight: 700;
            color: #fbbf24;
        }

        .genre-tag {
            display: inline-block;
            font-size: 8px;
            padding: 2px 8px;
            border-radius: 20px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 4px;
            text-transform: uppercase;
        }
        .genre-tag.scifi { background-color: #047857; }
        .genre-tag.action { background-color: #0369a1; }

        .movie-title {
            font-size: 10px;
            font-weight: 600;
            color: #9ca3af;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .movie-meta {
            font-size: 9px;
            color: #4b5563;
        }

        /* 2. Seção de Texto Principal (Hero) */
        .streaming-badge {
            background-color: rgba(6, 182, 212, 0.06);
            color: #22d3ee;
            border: 1px solid rgba(6, 182, 212, 0.15);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1.5px;
            margin-top: 30px;
            margin-bottom: 25px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 38px;
            font-weight: 900;
            line-height: 1.1;
            color: #22d3ee; /* Azul Neon idêntico à imagem */
            letter-spacing: 1.5px;
            margin-bottom: 20px;
        }

        .subtitle-count {
            font-size: 14px;
            font-weight: 700;
            color: #22d3ee;
            letter-spacing: 1px;
            margin-bottom: 15px;
        }

        .main-description {
            font-size: 13px;
            color: #6b7280;
            max-width: 480px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        /* 3. Android Tag */
        .android-box {
            background-color: rgba(17, 24, 39, 0.6);
            border: 1px solid #1f2937;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 11px;
            color: #9ca3af;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 25px;
        }

        /* 4. Botão de Download Otimizado */
        .cta-container {
            width: 100%;
            max-width: 340px;
            margin-bottom: 12px;
        }

        .btn-download {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            background: linear-gradient(135deg, #059669 0%, #10b981 100%);
            color: #ffffff;
            font-size: 15px;
            font-weight: 800;
            text-transform: uppercase;
            text-decoration: none;
            padding: 18px;
            border-radius: 12px;
            box-shadow: 0 0 25px rgba(16, 185, 129, 0.25);
            border: 1px solid rgba(255,255,255,0.1);
            cursor: pointer;
            transition: transform 0.2s;
        }

        .btn-download:active {
            transform: scale(0.98);
        }

        /* 5. Informações de Segurança e Estatísticas */
        .security-row {
            display: flex;
            justify-content: center;
            gap: 12px;
            font-size: 11px;
            color: #10b981;
            margin-bottom: 35px;
        }

        .stats-row {
            display: flex;
            gap: 10px;
            margin-bottom: 50px;
        }

        .stat-tag {
            background-color: rgba(17, 24, 39, 0.8);
            border: 1px solid #1f2937;
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 11px;
            color: #9ca3af;
            font-weight: 600;
        }

        .stat-tag.highlight {
            color: #22d3ee;
            border-color: rgba(34, 211, 238, 0.2);
        }

        /* 6. Grid de Recursos do Rodapé (Quadros com Borda) */
        .features-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            width: 100%;
            margin-top: 20px;
        }

        .feature-box {
            background-color: rgba(17, 24, 39, 0.3);
            border: 1px solid #111827;
            border-radius: 8px;
            padding: 20px 10px;
            text-align: center;
        }

        .feature-box .num {
            font-family: 'Orbitron', sans-serif;
            font-size: 22px;
            font-weight: 900;
            color: #22d3ee;
            margin-bottom: 4px;
        }

        .feature-box .lbl {
            font-size: 9px;
            text-transform: uppercase;
            color: #4b5563;
            letter-spacing: 1px;
            font-weight: 600;
        }

        /* Responsividade para Telas Pequenas */
        @media (max-width: 500px) {
            .features-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            h1 {
                font-size: 32px;
            }
        }
    </style>
</head>
