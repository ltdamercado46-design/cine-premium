    <style>
        /* Reset e Estilos Base */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #030712;
            color: #ffffff;
            font-family: 'Plus Jakarta Sans', sans-serif;
            text-align: center;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 800px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Seção de Filmes em Destaque */
        .featured-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #9ca3af;
            margin-bottom: 20px;
        }

        .movie-grid {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 40px;
            width: 100%;
            overflow-x: auto;
            padding-bottom: 10px;
        }

        .movie-card {
            position: relative;
            min-width: 110px;
            max-width: 130px;
            border-radius: 8px;
            overflow: hidden;
            background: #111827;
        }

        .movie-card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            display: block;
        }

        .rating {
            position: absolute;
            top: 6px;
            right: 6px;
            background: rgba(0, 0, 0, 0.75);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: bold;
            color: #fbbf24;
        }

        .movie-info {
            padding: 6px;
            text-align: left;
        }

        .genre {
            display: inline-block;
            font-size: 9px;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
            margin-bottom: 4px;
        }

        .genre.scifi { background: #047857; color: #a7f3d0; }
        .genre.action { background: #0369a1; color: #bae6fd; }

        .movie-name {
            font-size: 10px;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .movie-year {
            font-size: 9px;
            color: #6b7280;
        }

        /* Elementos de Texto Principal */
        .badge-streaming {
            font-size: 11px;
            font-weight: 700;
            color: #38bdf8;
            letter-spacing: 1.5px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .main-heading {
            font-family: 'Orbitron', sans-serif;
            font-size: 42px;
            font-weight: 900;
            line-height: 1.1;
            color: #38bdf8;
            letter-spacing: 1px;
            margin-bottom: 15px;
        }

        .sub-heading {
            font-size: 16px;
            font-weight: 700;
            color: #38bdf8;
            letter-spacing: 1px;
            margin-bottom: 15px;
        }

        .description {
            font-size: 14px;
            color: #9ca3af;
            max-width: 540px;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        /* Android Tag */
        .android-tag {
            font-size: 12px;
            color: #9ca3af;
            background: #111827;
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid #1f2937;
            margin-bottom: 20px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        /* Botão de Download Principal */
        .btn-download {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            max-width: 320px;
            background: linear-gradient(135deg, #059669 0%, #10b981 100%);
            color: #ffffff;
            font-size: 16px;
            font-weight: 700;
            text-transform: uppercase;
            text-decoration: none;
            padding: 16px 32px;
            border-radius: 30px;
            box-shadow: 0 4px 20px rgba(16, 185, 129, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
            margin-bottom: 15px;
            border: none;
            cursor: pointer;
        }

        .btn-download:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(16, 185, 129, 0.6);
        }

        /* Legendas de Segurança */
        .security-checks {
            display: flex;
            justify-content: center;
            gap: 15px;
            font-size: 12px;
            color: #10b981;
            margin-bottom: 30px;
        }

        /* Badges de Estatísticas */
        .stats-badges {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 60px;
        }

        .stat-badge {
            font-size: 12px;
            font-weight: 600;
            background: #111827;
            padding: 6px 14px;
            border-radius: 6px;
            border: 1px solid #1f2937;
            color: #9ca3af;
        }

        .stat-badge.blue {
            color: #38bdf8;
            border-color: rgba(56, 189, 248, 0.2);
        }

        /* Grid de Recursos no Rodapé */
        .features-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            width: 100%;
            border-top: 1px solid #1f2937;
            padding-top: 40px;
        }

        .feature-item {
            text-align: center;
        }

        .feature-number {
            font-family: 'Orbitron', sans-serif;
            font-size: 24px;
            font-weight: 700;
            color: #38bdf8;
            margin-bottom: 5px;
        }

        .feature-label {
            font-size: 11px;
            text-transform: uppercase;
            color: #6b7280;
            letter-spacing: 1px;
        }

        /* Responsividade para telas menores */
        @media (max-width: 640px) {
            .features-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 25px;
            }
            .main-heading {
                font-size: 32px;
            }
        }
    </style>
</head>
